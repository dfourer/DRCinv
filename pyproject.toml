
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drcinv"
version = "0.1.5"
description = "Python library for dynamic range compression and inversion"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    {name = "Dominique Fourer"}
]

dependencies = [
    "numba>=0.61",
    "numpy>=1.20",
    "scipy>=1.7"
]

[project.optional-dependencies]
demo = [
    "soundfile>=0.12",
    "matplotlib>=3.5"
]

test = [
    "pytest>=7.0"
]

param = [
    "torch>=2.0"
]

patternsearch = [
    "pymoo>=0.6.1,<0.7"
]

bayesopt = [
    "ax-platform>=1.3,<1.4"
]

[project.urls]
Homepage   = "https://hdrc-inv.github.io/"
Repository = "https://github.com/dfourer/DRCinv"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["drcinv*"]

[tool.setuptools.package-data]
"drcinv.drcparam" = ["data/*.json", "data/*.npz"]
