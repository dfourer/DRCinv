
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drcinv"
version = "0.1.4"
description = "Python library for dynamic range compression and inversion"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"

authors = [
    {name = "Dominique Fourer"}
]

dependencies = [
    "numpy>=1.20",
    "scipy>=1.7"
]

[project.optional-dependencies]
demo = [
    "soundfile>=0.12",
    "matplotlib>=3.5"
]

test = [
    "pytest>=7.0"
]

[project.urls]
Homepage   = "https://hdrc-inv.github.io/"
Repository = "https://github.com/dfourer/DRCinv"

[tool.setuptools]
py-modules = ["drcinv"]
package-dir = {"" = "src"}
