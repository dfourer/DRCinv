[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drcinv"
version = "0.1.0"
description = "Python library for dynamic range compression and inversion"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    {name = "Dominique Fourer"}
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "matplotlib>=3.7"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0"
]

[project.urls]
Homepage = "https://github.com/dfourer/DRCinv"
Repository = "https://github.com/dfourer/DRCinv"
# Paper = "https://doi.org/VOTRE_DOI"

[tool.setuptools]
py-modules = ["drclibrary"]
package-dir = {"" = "src"}
